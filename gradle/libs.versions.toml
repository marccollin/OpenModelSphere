# gradle/libs.versions.toml

[versions]
# Bibliothèques stables sur Maven Central
jgrapht = "1.1.0"
velocity = "2.4.1"
commons-lang3 = "3.20.0"
jython = "2.7.3"
antlr = "3.5.3"
stringtemplate = "4.0.2"
bcel = "6.8.1"
log4j = "2.26.1"
jdom = "1.1.3"

checkboxtree = "4.0" 

[libraries]
# Core libraries
jgrapht-core = { module = "org.jgrapht:jgrapht-core", version.ref = "jgrapht" }
velocity-engine = { module = "org.apache.velocity:velocity-engine-core", version.ref = "velocity" }

commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
jython-standalone = { module = "org.python:jython-standalone", version.ref = "jython" }
antlr = { module = "org.antlr:antlr", version.ref = "antlr" }
stringtemplate = { module = "org.antlr:stringtemplate", version.ref = "stringtemplate" }
bcel = { module = "org.apache.bcel:bcel", version.ref = "bcel" }

log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }

jdom = { module = "org.jdom:jdom", version.ref = "jdom" }

# UI / Components
checkboxtree = { module = "eu.essilab:lablib-checkboxtree", version.ref = "checkboxtree" }

# Bundles pratiques
[bundles]
core-libs = ["jgrapht-core", "velocity-engine", "commons-lang3"]
scripting-libs = ["jython-standalone", "antlr", "stringtemplate"]
